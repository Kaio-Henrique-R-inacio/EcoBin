<svg viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração da lixeira inteligente EcoBin escaneando resíduos com um feixe de luz azul e indicando o descarte correto" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FA8DE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FA8DE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="binGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9C68"/>
      <stop offset="100%" stop-color="#2F6E48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FA8DE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4FA8DE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra no chão -->
  <ellipse cx="270" cy="432" rx="150" ry="18" fill="#0B0F0D" opacity="0.55"/>

  <!-- brilho geral do escaneamento -->
  <circle cx="290" cy="190" r="150" fill="url(#glow)"/>

  <!-- feixe de luz azul -->
  <path d="M255 250 L200 150 L380 150 L325 250 Z" fill="url(#beamGrad)"/>

  <!-- partículas / folhas decorativas -->
  <circle cx="120" cy="120" r="5" fill="#6EBE8A" opacity="0.8"/>
  <circle cx="150" cy="90" r="3" fill="#4FA8DE" opacity="0.7"/>
  <circle cx="430" cy="130" r="4" fill="#6EBE8A" opacity="0.7"/>
  <circle cx="410" cy="90" r="3" fill="#4FA8DE" opacity="0.6"/>
  <path d="M95 300c14-10 32-6 38 8-14 10-32 6-38-8Z" fill="#3C8C5D" opacity="0.85"/>
  <path d="M430 320c-14-10-32-6-38 8 14 10 32 6 38-8Z" fill="#3C8C5D" opacity="0.85"/>

  <!-- garrafa flutuando (resíduo escaneado) -->
  <g>
    <path d="M270 120h20v14c8 4 12 12 12 22v50a10 10 0 0 1-10 10h-24a10 10 0 0 1-10-10v-50c0-10 4-18 12-22Z"
          fill="#EDEFEC" opacity="0.92"/>
    <rect x="272" y="112" width="16" height="10" rx="2" fill="#C9D1CB"/>
  </g>

  <!-- selo de acerto -->
  <g>
    <circle cx="352" cy="140" r="20" fill="#3C8C5D"/>
    <path d="M343 140l6 6 12-14" fill="none" stroke="#F4F6F3" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- corpo da lixeira -->
  <path d="M175 250h190l-16 168a16 16 0 0 1-16 14.5H207a16 16 0 0 1-16-14.5Z" fill="url(#binGrad)"/>

  <!-- tampa -->
  <rect x="165" y="228" width="210" height="24" rx="10" fill="#6EBE8A"/>
  <rect x="245" y="205" width="50" height="24" rx="10" fill="#6EBE8A"/>

  <!-- painel / tela da lixeira -->
  <rect x="205" y="285" width="130" height="80" rx="8" fill="#0B0F0D" stroke="#4FA8DE" stroke-width="2"/>
  <line x1="205" y1="300" x2="335" y2="300" stroke="#4FA8DE" stroke-width="2" opacity="0.85"/>
  <rect x="218" y="315" width="90" height="8" rx="4" fill="#4FA8DE" opacity="0.85"/>
  <rect x="218" y="332" width="70" height="6" rx="3" fill="#B9C2BC" opacity="0.7"/>
  <rect x="218" y="345" width="55" height="6" rx="3" fill="#B9C2BC" opacity="0.5"/>

  <!-- sensor central com scanner -->
  <circle cx="270" cy="252" r="9" fill="#0B0F0D" stroke="#4FA8DE" stroke-width="2"/>
  <circle cx="270" cy="252" r="3" fill="#4FA8DE"/>
</svg>
